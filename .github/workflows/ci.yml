name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start isolated database, Auth and private Realtime
        run:
          supabase start -x
          studio,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Run database tests
        run: supabase test db

      - name: Check isolated database security advisors
        run: supabase db advisors --local --type security --level warn --fail-on error

      - name: Enable Corepack for integration tests
        run: corepack enable

      - name: Set up Node.js for integration tests
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install integration dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @provide/contracts build

      - name: Test public API against the migrated database
        run: pnpm --filter @provide/api exec vitest run src/storefront.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Prepare masked loopback Realtime credentials
        run: node scripts/ci-realtime-env.mjs

      - name: Test two authenticated dashboards on real private Realtime
        run: pnpm --filter @provide/api exec vitest run src/realtime.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test actual local Auth invitations and personnel access revocation
        run: pnpm --filter @provide/api exec vitest run src/personnel.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test actual isolated account recovery and MFA session boundaries
        run:
          pnpm --filter @provide/api exec vitest run src/recovery.integration.test.ts
          src/recovery-loss.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name:
          Test actual isolated support grants, MFA, session revocation and transaction boundaries
        run: pnpm --filter @provide/api exec vitest run src/support.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Legacy scenarios require their fresh queue fixture. Run them before the
      # O3 suites intentionally retain committed orders/outbox effects.
      - name: Test O3 real PostgreSQL concurrency and protected dispatcher
        run: pnpm --filter @provide/api exec vitest run src/checkout-protection.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Install Chromium for the integrated HTTPS checkout evidence
        run: pnpm --filter @provide/storefront exec playwright install --with-deps chromium

      - name: Test actual HTTPS browser, gateway, API and PostgreSQL checkout recovery
        run: node scripts/ci-checkout-http.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Retain integrated checkout browser evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkout-http-browser
          path: output/checkout-http-browser
          if-no-files-found: ignore

  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @provide/contracts build
      - run:
          pnpm --filter @provide/storefront exec playwright install --with-deps ${{ matrix.engine }}
      - name: Provide a clocked virtual audio output for Firefox
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=provide_ci
          pactl set-default-sink provide_ci
      - run: pnpm --filter @provide/storefront test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: menu-cart-browser-${{ matrix.engine }}
          path: output/menu-cart-browser
          if-no-files-found: ignore
