name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start isolated test database
        run: supabase db start

      - name: Run database tests
        run: supabase test db

      - name: Check isolated database security advisors
        run: supabase db advisors --local --type security --level warn --fail-on error

      - name: Enable Corepack for integration tests
        run: corepack enable

      - name: Set up Node.js for integration tests
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install integration dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @provide/contracts build

      - name: Test public API against the migrated database
        run: pnpm --filter @provide/api exec vitest run src/storefront.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @provide/contracts build
      - run: pnpm --filter @provide/storefront exec playwright install --with-deps chromium
      - run: pnpm --filter @provide/storefront test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: menu-cart-browser
          path: output/menu-cart-browser
          if-no-files-found: ignore
